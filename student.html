<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Profile｜DALI STUDY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070807;--panel:#111311;--panel2:#171a17;--text:#f7f7f2;--muted:#a7aca6;--line:#2a2e2a;--accent:#d7ff68;--max:1220px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei","Heiti TC",serif;line-height:1.55}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.wrap{width:min(var(--max),calc(100% - 32px));margin:auto}
.nav{position:fixed;z-index:20;top:0;left:0;right:0;background:linear-gradient(#070807ef,#07080700);padding:18px 0}.navin{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;letter-spacing:.08em}.back{color:var(--muted);font-size:.9rem}.back:hover{color:var(--accent)}
.profile-head{padding:130px 0 40px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.profile-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--accent);display:grid;place-items:center;font-size:2.4rem;font-weight:900;color:#10120e;flex-shrink:0}
.profile-name{font-size:clamp(2.2rem,5vw,3.4rem);letter-spacing:-.03em;margin:0}
.grade-tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:3px 10px;vertical-align:middle;margin-left:8px}
.profile-stats{color:var(--muted);font-size:.95rem;margin-top:6px;max-width:520px;line-height:1.6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:34px}
.tab-btn{border:1px solid var(--line);border-radius:999px;background:transparent;color:#dfe2dd;padding:9px 16px;font-family:inherit;font-size:.92rem}
.tab-btn.active,.tab-btn:hover{background:var(--accent);border-color:var(--accent);color:#10120e}
.tab-panel{display:none}.tab-panel.active{display:block}
main{padding-bottom:120px;min-height:50vh}
.about-text{width:100%;max-width:1100px;color:var(--muted);font-size:1.05rem;line-height:1.85}
.about-text p{margin:0 0 16px}
.about-heading{color:var(--accent);font-size:.95rem;font-weight:800;letter-spacing:.04em;margin:24px 0 10px}
.about-heading:first-child{margin-top:0}
.film-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.film{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.25s}
.film:hover{transform:translateY(-5px);border-color:#4e554e}
.frame{position:relative;aspect-ratio:9/16;background:#000;cursor:pointer}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.frame img{width:100%;height:100%;object-fit:cover;display:block;opacity:.75}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:#000000b0;border:2px solid #ffffffcc;color:#fff;font-size:1.3rem;display:grid;place-items:center;padding-left:4px}
.frame:hover .play-btn{background:var(--accent);color:#10120e;border-color:var(--accent)}
.film-info{padding:16px}.film-info span{color:var(--accent);font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.film-info h3{font-size:1.15rem;margin:6px 0 4px}.film-info p{margin:0;color:var(--muted);font-size:.88rem}
.reflection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.reflection-card{border:1px solid var(--line);background:var(--panel);border-radius:22px;overflow:hidden}
.reflection-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.reflection-body{padding:18px}.reflection-body .day-tag{color:var(--accent);font-weight:800;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase}
.reflection-text{white-space:pre-wrap;color:#d9dcd7;margin:8px 0 0;font-size:.94rem}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo-item{aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.reflection-empty{border:1px dashed var(--line);border-radius:18px;padding:24px;color:var(--muted);grid-column:1/-1;text-align:center}
@keyframes skeleton-shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skeleton{background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 37%,var(--panel) 63%);background-size:400% 100%;animation:skeleton-shimmer 1.6s ease infinite}
.sk-avatar{width:96px;height:96px;border-radius:50%}
.sk-line{height:1em;border-radius:6px}
footer.footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:.83rem}
.back-link{display:inline-block;margin:30px 0 10px;color:var(--muted);font-size:.92rem}.back-link:hover{color:var(--accent)}
@media(max-width:700px){.film-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.film-grid{grid-template-columns:1fr}.profile-head{padding-top:110px}}
.cert-gate{max-width:420px;margin:50px auto;text-align:center;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:36px 28px}
.cert-gate-text{color:var(--muted);margin:0 0 18px;font-size:.98rem}
.cert-gate-row{display:flex;gap:10px;justify-content:center}
.cert-gate-row input{width:110px;text-align:center;font-size:1.2rem;letter-spacing:.15em;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:inherit}
.cert-gate-row input:focus{outline:none;border-color:var(--accent)}
.cert-unlock-btn{padding:10px 20px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#10120e;font-weight:800}
.cert-gate-error{color:#e07a5f;margin-top:14px;font-size:.88rem}
.cert-content{max-width:640px;margin:20px auto 0;text-align:center}
.cert-item{margin:0 0 44px}
.cert-item:last-child{margin-bottom:0}
.cert-item-label{color:var(--accent);font-weight:800;font-size:1.05rem;letter-spacing:.02em;margin-bottom:6px}
.cert-item-caption{color:var(--muted);font-size:.88rem;margin-bottom:18px}
.cert-preview{width:100%;border-radius:16px;border:1px solid var(--line);display:block;margin:0 auto 22px;background:var(--panel2)}
.cert-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cert-download-btn{padding:10px 22px;border-radius:999px;border:1px solid var(--line);color:var(--text);font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.cert-download-btn:hover{border-color:var(--accent);color:var(--accent)}
.daphne-letter{max-width:1100px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 32px;position:relative;margin:10px 0 30px}
.daphne-quote{font-size:2.8rem;color:var(--lc,#e8b04f);line-height:1;font-family:Georgia,serif;position:absolute;top:16px;left:22px;opacity:.55}
.daphne-lead{color:var(--text);font-weight:700;font-size:1.32rem;line-height:1.6;margin:26px 0 16px;padding-left:8px}
.daphne-text{margin:0 0 24px;padding-left:8px;color:#d9dcd7;font-size:1.05rem;line-height:1.8}
.daphne-text p{margin:0 0 14px}
.daphne-text p:last-child{margin-bottom:0}
.daphne-foot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.daphne-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--lc,#e8b04f)}
.daphne-foot span{color:var(--muted);font-size:.95rem}
.study-box{max-width:1100px;width:100%;margin:10px 0 30px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 14px 14px 0;padding:24px 28px}
.study-label{color:var(--accent);font-weight:800;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.study-box p{color:#d9dcd7;font-size:1.1rem;line-height:1.9;margin:0 0 14px}
.study-box p:last-child{margin-bottom:0}
@media(max-width:700px){
  .daphne-letter{padding:22px 20px}
  .daphne-quote{font-size:2.2rem;top:12px;left:16px}
  .daphne-lead{font-size:1.12rem;margin-top:20px}
  .daphne-text{font-size:.98rem}
  .study-box{padding:20px 20px}
  .study-box p{font-size:1.02rem}
}
</style>
</head>

<div class="profile-head" id="profileHead"><div class="sk-avatar skeleton"></div><div style="flex:1"><div class="sk-line skeleton" style="width:180px;height:2.2rem;margin-bottom:10px"></div><div class="sk-line skeleton" style="width:260px"></div></div></div>

  <button class="tab-btn active" data-tab="about">About 簡介</button>

<main>
  <div class="tab-panel active" id="panel-about"><div class="sk-line skeleton" style="width:90%;margin-bottom:10px"></div><div class="sk-line skeleton" style="width:70%"></div><div class="about-text" id="aboutText" style="display:none"></div></div>
  <div class="tab-panel" id="panel-videos"><div class="film-grid" id="videoGrid"></div></div>

      </div>
      <p class="cert-gate-error" id="certGateError" style="display:none">生日不正確，請再試一次</p>

<footer class="footer"><div class="wrap"><span>DALI STUDY · Melbourne Student Film Showcase 2026</span></div></footer>

<script src="data.js"></script>
<script>
function renderRichText(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    // 純姓名方括號行(例如「【姓名】」),跟頁面上方已顯示的大名字重複,直接移除不顯示
    if(/^[【\[].+[】\]]$/.test(line))return '';
    const m=line.match(/^[｜|](.+)[｜|]$/);
    if(m)return `<div class="about-heading">${esc(m[1])}</div>`;
    return `<p>${esc(line)}</p>`;
  }).filter(Boolean).join('');
}

// 這些標題一旦出現在 about/{name}.txt 裡，這個標題(含)之後的內容就會自動分流到「Message from teacher」分頁，
// 不會留在 About 分頁。之後有新的教師心得標題，把它加進這個清單即可。
const TEACHER_HEADINGS=['後續學習建議','message from daphne','message from teacher'];
function splitAboutAndTeacher(text){
  if(!text)return{aboutPart:'',teacherPart:''};
  const lines=text.split('\n');
  let idx=-1;
  for(let i=0;i<lines.length;i++){
    const m=lines[i].trim().match(/^[｜|](.+)[｜|]$/);
    if(m&&TEACHER_HEADINGS.includes(m[1].trim().toLowerCase()))
    {idx=i;break;}
  }
  if(idx===-1)return{aboutPart:text.trim(),teacherPart:''};
  return{aboutPart:lines.slice(0,idx).join('\n').trim(),teacherPart:lines.slice(idx).join('\n').trim()};
}
const params=new URLSearchParams(location.search);
const studentKey=(params.get('name')||'').toLowerCase();

// 專門給 Message from teacher 分頁用：
// 「Message from {Name}」→ 書信卡片(第一句放大加粗當開場白，其餘正常段落)；每位寄件人可以有自己的頭像跟顏色。
// 「學習建議／後續學習建議」→ 專屬框框；其他標題維持一般樣式。
// 顯示順序固定：LETTER_ORDER 裡的順序 → 學習建議，不受檔案裡實際打字順序影響。
// 之後要新增新的老師心得，只要在 LETTER_SENDERS 跟 LETTER_ORDER 各加一行就好。
const LETTER_SENDERS={
  'message from daphne':{avatar:'days/_avatar/daphne_avatar.jpg',name:'Daphne',color:'#e8b04f'},
  'message from wendy':{avatar:'days/_avatar/wendy_avatar.jpg',name:'Wendy',color:'#7c93a8'}
};
const LETTER_ORDER=['message from daphne','message from wendy'];
function splitLeadSentence(text){
  const m=text.match(/^(.*?[。！？!?])([\s\S]*)$/);
  if(m)return{lead:m[1],rest:m[2].trim()};
  return{lead:text,rest:''};
}
function renderTeacherText(text){
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const STUDY_HEADINGS=['學習建議','後續學習建議'];
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  let mode='normal',buffer=[],letterHtmlMap={},studyHtml='',otherHtml='';
  const flush=()=>{
    if(LETTER_SENDERS[mode]&&buffer.length){
      const{lead,rest}=splitLeadSentence(buffer[0]);
      const bodyParas=(rest?[rest]:[]).concat(buffer.slice(1));
      const s=LETTER_SENDERS[mode];
      letterHtmlMap[mode]=`<div class="daphne-letter" style="--lc:${s.color}"><div class="daphne-quote">"</div><p class="daphne-lead">${esc(lead)}</p><div class="daphne-text">${bodyParas.map(p=>`<p>${esc(p)}</p>`).join('')}</div><div class="daphne-foot"><img class="daphne-avatar" src="${s.avatar}" alt="${s.name}" onerror="this.style.display='none'"><span>— ${s.name}</span></div></div>`;
    }else if(mode==='study'&&buffer.length){
      studyHtml=`<div class="study-box"><div class="study-label">學習建議</div>${buffer.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
    }
    buffer=[];mode='normal';
  };
  for(const line of lines){
    if(/^[【\[].+[】\]]$/.test(line))continue;
    const m=line.match(/^[｜|](.+)[｜|]$/);
    if(m){
      flush();
      const headingText=m[1].trim();
      const headingKey=headingText.toLowerCase();
      if(LETTER_SENDERS[headingKey])mode=headingKey;
      else if(STUDY_HEADINGS.includes(headingText))mode='study';
      else{otherHtml+=`<div class="about-heading">${esc(headingText)}</div>`;mode='normal';}
      continue;
    }
    if(mode!=='normal')buffer.push(line);
    else otherHtml+=`<p>${esc(line)}</p>`;
  }
  flush();
  const lettersHtml=LETTER_ORDER.map(k=>letterHtmlMap[k]||'').join('');
  return otherHtml+lettersHtml+studyHtml;
}

function lazyFrameHtml(id){
  return `<div class="frame" data-yt="${id}"><img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="Video thumbnail" loading="lazy"><button class="play-btn" aria-label="播放">▶</button></div>`;
}
function bindLazyFrames(){
  document.querySelectorAll('.frame[data-yt]').forEach(f=>{
    if(f.dataset.bound)return;
    f.dataset.bound='1';
    f.onclick=()=>{
      const id=f.dataset.yt;
      f.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" title="Video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
    };
  });
}
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.querySelector(`#panel-${b.dataset.tab}`).classList.add('active');
});

function buildDaysTree(fileList){
  const tree={};
  for(const path of fileList){
    const m=path.match(/^days\/([^\/]+)\/([^\/]+)$/);
    if(m){const [,folder,file]=m;(tree[folder]=tree[folder]||[]).push(file);}
  }
  return tree;
}

async function init(){
  if(!studentKey||!knownStudents.includes(studentKey)){
    document.querySelector('#profileHead').innerHTML='<div class="reflection-empty">找不到這位學生，請確認網址是否正確（例如 student.html?name=eric）。</div>';
    return;
  }
  const displayName=studentKey.charAt(0).toUpperCase()+studentKey.slice(1);
  const grade=studentGradeMap[studentKey];
  const surname=(typeof studentSurnameMap!=='undefined'&&studentSurnameMap[studentKey])?studentSurnameMap[studentKey]:'';
  const fullName=surname?`${displayName} ${surname}`:displayName;
  const myWorks=works.filter(w=>w.student.toLowerCase()===studentKey);

  const {files,error}=await loadFileList(['days','certificates']);
  if(error){
    document.querySelector('#profileHead').innerHTML=`<div class="reflection-empty">抓取失敗：${error}</div>`;
    return;
  }

  // avatar
  let avatarUrl=null;
  const avatarFile=files.find(p=>{
    const m=p.match(/^days\/_avatar\/([^\/]+)$/);
    if(!m)return false;
    return m[1].toLowerCase().startsWith(studentKey);
  });
  if(avatarFile)avatarUrl=avatarFile;

  document.querySelector('#profileHead').innerHTML=`
    ${avatarUrl?`<img src="${avatarUrl}" class="profile-avatar" alt="${fullName}">`:`<div class="profile-avatar">${displayName[0]}</div>`}
    <div style="flex:1;min-width:220px"><h1 class="profile-name">${fullName}${grade?`<span class="grade-tag">${grade}</span>`:''}</h1><div class="profile-stats" id="profileStats"></div></div>
  `;
  document.querySelector('#tabs').style.display='flex';

  // videos
  const videoGrid=document.querySelector('#videoGrid');
  if(myWorks.length){
    videoGrid.innerHTML=myWorks.map(w=>`<article class="film">${lazyFrameHtml(w.id)}<div class="film-info"><span>${w.topic}</span><h3>${w.title}</h3><p>${w.desc}</p></div></article>`).join('');
    bindLazyFrames();
  }else{
    videoGrid.innerHTML='<div class="reflection-empty">目前還沒有已確認的影片。</div>';
  }

  // reflections
  const tree=buildDaysTree(files);
  const dayFolders=Object.keys(tree).filter(k=>!k.startsWith('_')).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const reflectionEntries=[];
  for(const folder of dayFolders){
    const dayFiles=tree[folder];
    const txtFile=dayFiles.find(f=>f.toLowerCase()===`${studentKey}.txt`);
    if(!txtFile)continue;
    const photoFiles=dayFiles.filter(f=>{
      const m=f.match(/^([a-zA-Z]+).*\.(jpe?g|png|webp)$/i);
      return m&&m[1].toLowerCase()===studentKey;
    }).sort();
    let text='';
    try{const r=await fetch(`days/${folder}/${txtFile}`,{cache:'no-store'});if(r.ok)text=(await r.text()).trim();}catch(e){}
    if(text)reflectionEntries.push({folder,photo:photoFiles[0]?`days/${folder}/${photoFiles[0]}`:null,text});
  }
  const reflectionGrid=document.querySelector('#reflectionGrid');
  if(reflectionEntries.length){
    reflectionGrid.innerHTML=reflectionEntries.map(r=>`<article class="reflection-card">${r.photo?`<img src="${r.photo}" alt="${fullName}">`:''}<div class="reflection-body"><div class="day-tag">${formatDayTitle(r.folder)}</div><p class="reflection-text">${r.text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</p></div></article>`).join('');
  }else{
    reflectionGrid.innerHTML='<div class="reflection-empty">目前還沒有心得紀錄。</div>';
  }

  // stats
  const filmWord=myWorks.length===1?'film':'films';
  const journalWord=reflectionEntries.length===1?'reflection':'reflections';
  document.querySelector('#profileStats').textContent=`In 2026, I picked up a camera, made ${myWorks.length} ${filmWord}, shared ${reflectionEntries.length} ${journalWord}, and pushed myself a little further every single day. This was my Melbourne story.`;

  // about
  const aboutFile=files.find(p=>p.toLowerCase()===`about/${studentKey}.txt`);
  let aboutRaw='';
  if(aboutFile){
    try{const r=await fetch(aboutFile,{cache:'no-store'});if(r.ok)aboutRaw=(await r.text()).trim();}catch(e){}
  }
  const {aboutPart,teacherPart:teacherFromAbout}=splitAboutAndTeacher(aboutRaw);
  let aboutText=aboutPart;
  if(!aboutText){
    aboutText=`${fullName}${grade?`（${grade}）`:''} 參與了這趟墨爾本遊留學，完成了 ${myWorks.length} 支自製影片與 ${reflectionEntries.length} 篇每日心得。點上方分頁可以瀏覽所有作品、心得與照片。`;
  }
  document.querySelector('#aboutText').innerHTML=renderRichText(aboutText);
  document.querySelectorAll('#panel-about .sk-line').forEach(el=>el.style.display='none');
  document.querySelector('#aboutText').style.display='block';

  // Message from teacher（合併兩個來源：about/{name}.txt 裡分流出來的教師內容 + feedback/{name}.txt）
  const feedbackFile=files.find(p=>p.toLowerCase()===`feedback/${studentKey}.txt`);
  let feedbackRaw='';
  if(feedbackFile){
    try{const r=await fetch(feedbackFile,{cache:'no-store'});if(r.ok)feedbackRaw=(await r.text()).trim();}catch(e){}
  }
  const teacherText=[teacherFromAbout,feedbackRaw].filter(Boolean).join('\n\n');
  if(teacherText){
    document.querySelector('#feedbackText').innerHTML=renderTeacherText(teacherText);
    document.querySelector('#tabFeedbackBtn').style.display='inline-flex';
  }

  // 證照（有任一張才顯示分頁；需要輸入這位學生自己的生日 4 碼才能解鎖）
  // 之後如果還有第三張證書，只要在這裡加一個項目就好。
  const CERT_ITEMS=[
    {key:'melbourne',label:'The University of Melbourne',caption:'2026 University Studies Immersion Program · Melbourne, Victoria'},
    {key:'rmit',label:'RMIT University',caption:'2026 University Studies Immersion Program · Melbourne, Victoria'}
  ];
  const foundCerts=CERT_ITEMS.map(item=>{
    const pdf=files.find(p=>p.toLowerCase()===`certificates/${studentKey}_${item.key}.pdf`);
    const jpg=files.find(p=>p.toLowerCase()===`certificates/${studentKey}_${item.key}.jpg`)
      ||files.find(p=>p.toLowerCase()===`certificates/${studentKey}_${item.key}.jpeg`);
    return{...item,pdf,jpg};
  }).filter(c=>c.pdf||c.jpg);
  if(foundCerts.length){
    document.querySelector('#tabCertBtn').style.display='inline-flex';
    const unlock=()=>{
      const val=document.querySelector('#certBirthdayInput').value.trim();
      const expected=(typeof studentBirthdayMap!=='undefined')?studentBirthdayMap[studentKey]:null;
      if(expected&&val===expected){
        document.querySelector('#certGate').style.display='none';
        const content=document.querySelector('#certContent');
        content.style.display='block';
        content.innerHTML=foundCerts.map(c=>`
          <div class="cert-item">
            <div class="cert-item-label">${c.label}</div>
            <div class="cert-item-caption">${c.caption}</div>
            ${c.jpg?`<img src="${c.jpg}" class="cert-preview" alt="${c.label} 證照預覽">`:''}
            <div class="cert-actions">
              ${c.pdf?`<a href="${c.pdf}" download class="cert-download-btn">下載 PDF</a>`:''}
              ${c.jpg?`<a href="${c.jpg}" download class="cert-download-btn">下載 JPEG</a>`:''}
            </div>
          </div>`).join('');
      }else{
        document.querySelector('#certGateError').style.display='block';
      }
    };
    document.querySelector('#certUnlockBtn').onclick=unlock;
    document.querySelector('#certBirthdayInput').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
  }
}
init();
</script>
</body></html>
